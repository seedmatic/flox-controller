# The base flox carrier, described as a FloxEnv (consumption: image).
#
# `flox containerize` of this env produces the OCI base image that flox-injected pods run
# on. It is the CANONICAL carrier-contract provider and the root of the carrier
# composition tree — specialised carriers `[include]` it by path. See docs/design.md
# § Carriers + § The carrier-contract invariant.
apiVersion: flox.seedmatic.io/v1alpha1
kind: FloxEnv
metadata:
  name: carrier
  namespace: flox-system
spec:
  consumption: image
  folder: flox-system
  manifest:
    # What `flox activate` needs to bootstrap inside the container:
    install:
      bashInteractive: { pkg-path: bashInteractive }   # /bin/sh + bash
      coreutils:       { pkg-path: coreutils }          # /usr/bin/env + core tools
      cacert:          { pkg-path: cacert }             # CA bundle
    # OPEN — the rest of the carrier CONTRACT is base-image files, NOT flox packages:
    # real /etc/{passwd,group,nsswitch.conf} (flox activate does getpwuid(0) at start →
    # needs a REAL /etc/passwd, not a /nix/store symlink — the plugin's /nix overlay would
    # shadow a store symlink). How does `flox containerize` provide these base files?
    # candidates: a flox containerize option, a [profile]/hook step, or a thin
    # post-containerize layer. This is exactly the concrete question this sample surfaces
    # (design.md § Open / to verify). If flox containerize does NOT provide them, the
    # `image`-consumption path needs a small post-step that writes them.
  update:
    mode: Manual
