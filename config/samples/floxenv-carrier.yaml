# The base flox carrier, described as a FloxEnv (consumption: image).
#
# `flox containerize` of this env produces the OCI base image that flox-injected pods run
# on. It is the CANONICAL carrier-contract provider and the root of the carrier
# composition tree — specialised carriers `[include]` it by path. See docs/design.adoc
# § Carriers + § The carrier-contract invariant.
apiVersion: flox.seedmatic.io/v1alpha1
kind: FloxEnv
metadata:
  name: carrier
  namespace: flox-system
spec:
  consumption: image
  folder: flox-system
  manifest:
    # What `flox activate` needs to bootstrap inside the container:
    install:
      bashInteractive: { pkg-path: bashInteractive }   # /bin/sh + bash
      coreutils:       { pkg-path: coreutils }          # /usr/bin/env + core tools
      cacert:          { pkg-path: cacert }             # CA bundle
    # The rest of the carrier contract — /etc/{passwd,group,nsswitch.conf} — is provided
    # by `flox containerize` itself via nixpkgs fakeNss: those are /nix/store symlinks,
    # not real files (verified spike, flox 1.14; passwd already carries root:x:0:0). No
    # extra packages needed. They resolve at runtime because the NRI plugin overlays
    # /nix→/nix with the HOST store as lower, so the image's /nix is disposable and the
    # host store is authoritative for everything (incl. the entrypoint). Requirement: the
    # controller realises AND GC-roots the carrier's full containerize closure on each
    # node. See design.adoc § The carrier-contract invariant.
  update:
    mode: Manual
